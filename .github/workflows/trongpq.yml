name: trongpq

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - core/**
  #     - collectors/**
  #     - .github/workflows/trongpq.yml
  #     - .github/workflows/shared-terraform.yml
  #   # kích hoạt khi push lên có sự thay đổi của các file trong thư mục core, collectors hoặc các file workflow liên quan đến terraform
  # schedule:
  #   # Lên lịch chạy tự động theo thời gian
  #   - cron: "0 6 * * *" 
permissions:
  id-token: write
  contents: read

jobs:
  core-qa:
    name: core-qa
    strategy:
      matrix:
        region:
          - eu-central-1
    uses: ./.github/workflows/shared-terraform.yml
    with:
      deployment_path: core/deployment
      target_environment: trongpq-qa
      target_region: ${{ matrix.region }}
    permissions:
      id-token: write
      contents: read

  collector-qa:
    name: collector-qa
    needs: core-qa
    strategy:
      matrix:
        region:
          - eu-central-1
    uses: ./.github/workflows/shared-terraform.yml
    with:
      deployment_path: collectors/deployment
      target_environment: trongpq-qa
      target_region: ${{ matrix.region }}
    permissions:
      id-token: write
      contents: read

